agents:
    root_agent: codex
norma:
    agents:
        claude_code:
            claude_code_acp:
                model: claude-sonnet-4-6
            type: claude_code_acp
        codex:
            codex_acp:
                model: gpt-5.3-codex
            type: codex_acp
        copilot:
            copilot_acp:
                model: gpt-5-codex
            type: copilot_acp
        gemini:
            gemini_acp:
                model: gemini-3-flash-preview
            type: gemini_acp
        opencode:
            opencode_acp:
                model: opencode/big-pickle
            type: opencode_acp
        pool:
            pool:
                members:
                    - codex
                    - opencode
                    - copilot
                    - gemini
                    - claude_code
            type: pool
    mcp_servers:
        playground_ping_pong:
            args:
                - playground
                - mcp
                - ping-pong
            cmd:
                - go
                - run
                - ./cmd/norma
            type: stdio
profiles:
    default:
        relay:
            root_agent: opencode
relay:
    system_instructions: |
        You are my relay agent.
        Prefer concise, actionable answers.
        When a request is ambiguous, ask one short clarifying question.
    logger:
        level: info
        pretty: true
    mcp_servers: []
    root_agent: codex
    state_dir: .config/relay
    telegram:
        token: ""
        webhook:
            auth_token: ""
            enabled: false
            listen_addr: 0.0.0.0:8080
            path: /telegram/webhook
            url: ""
    working_dir: ""
    workspace:
        mode: auto
        base_branch: master
