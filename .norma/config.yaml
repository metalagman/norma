runtime:
  providers:
    gemini_acp_agent:
      type: gemini_acp
      gemini_acp:
        model: gemini-3-flash-preview
    opencode_acp_agent:
      type: opencode_acp
      opencode_acp:
        model: opencode/big-pickle
        extra_args:
            - --print-logs
            - --log-level=DEBUG
    codex_acp_agent:
      type: codex_acp
      codex_acp:
        model: gpt-5-codex
    copilot_acp:
      type: copilot_acp
      copilot_acp:
        model: gpt-5-codex
    claude_code_acp_agent:
      type: claude_code_acp
      claude_code_acp:
        model: claude-sonnet-4-20250514
    custom_generic_acp_agent:
      type: generic_acp
      generic_acp:
        cmd: ["custom-acp-cli", "--acp"]
    fallback_pool:
      type: pool
      pool:
        members:
          - opencode_acp_agent
          - gemini_acp_agent

  # Example MCP server configurations:
  # mcp_servers:
  #   my_mcp_server:
  #     type: stdio
  #     cmd: ["npx", "-y", "@example/mcp-server"]

cli:
  pdca:
    plan: gemini_acp_agent
    do: gemini_acp_agent
    check: gemini_acp_agent
    act: gemini_acp_agent
  planner: gemini_acp_agent
  budgets:
    max_iterations: 5
  retention:
    keep_last: 50
    keep_days: 30
profiles:
  default:
    cli:
      pdca:
        plan: gemini_acp_agent
        do: gemini_acp_agent
        check: gemini_acp_agent
        act: gemini_acp_agent
      planner: gemini_acp_agent
  gemini:
    cli:
      pdca:
        plan: gemini_acp_agent
        do: gemini_acp_agent
        check: gemini_acp_agent
        act: gemini_acp_agent
      planner: gemini_acp_agent
  opencode:
    cli:
      pdca:
        plan: opencode_acp_agent
        do: opencode_acp_agent
        check: opencode_acp_agent
        act: opencode_acp_agent
      planner: opencode_acp_agent
  acp:
    cli:
      pdca:
        plan: gemini_acp_agent
        do: opencode_acp_agent
        check: codex_acp_agent
        act: codex_acp_agent
      planner: gemini_acp_agent
  copilot:
    cli:
      pdca:
        plan: copilot_acp
        do: copilot_acp
        check: copilot_acp
        act: copilot_acp
      planner: copilot_acp
  pool_fallback:
    cli:
      pdca:
        plan: fallback_pool
        do: fallback_pool
        check: fallback_pool
        act: fallback_pool
      planner: fallback_pool
