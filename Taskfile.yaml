# Taskfile for norma build automation
version: '3'

vars:
  NORMA_BINARY_NAME: norma
  NORMA_MAIN_PATH: ./cmd/norma
  OUTPUT_DIR: bin
  
tasks:
  default:
    desc: Build norma binary
    cmds:
      - mkdir -p {{.OUTPUT_DIR}}
      - go build -o {{.OUTPUT_DIR}}/{{.NORMA_BINARY_NAME}} {{.NORMA_MAIN_PATH}}
    
  install:
    desc: Build and install norma to GOBIN
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
    cmds:
      - echo "Installing {{.NORMA_BINARY_NAME}} version {{.VERSION}}"
      - go install -ldflags "-X main.version={{.VERSION}}" {{.NORMA_MAIN_PATH}}
    
  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.OUTPUT_DIR}}
      
  test:
    desc: Run tests
    cmds:
      - go test ./...

  test:integration:opencode:
    desc: Run OpenCode ACP integration tests for pkg/runtime/acpagent (requires real opencode and local config)
    cmds:
      - go test -tags='integration,opencode' -count=1 ./pkg/runtime/acpagent

  test:integration:codex:
    desc: Run Codex ACP bridge integration tests for pkg/runtime/acpagent (requires npx, bridge package, and Codex auth/network)
    cmds:
      - go test -tags='integration,codex' -count=1 ./pkg/runtime/acpagent

  test:integration:acp:
    desc: Run all ACP integration tests for pkg/runtime/acpagent
    cmds:
      - go test -tags='integration,opencode,codex' -count=1 ./pkg/runtime/acpagent

  lint:
    desc: Run golangci-lint
    cmds:
      - go tool golangci-lint run
