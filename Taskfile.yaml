# Taskfile for norma build automation
version: '3'

vars:
  NORMA_BINARY_NAME: norma
  NORMA_MAIN_PATH: ./cmd/norma
  OUTPUT_DIR: bin
  
tasks:
  default:
    desc: Build norma binary
    cmds:
      - mkdir -p {{.OUTPUT_DIR}}
      - go build -o {{.OUTPUT_DIR}}/{{.NORMA_BINARY_NAME}} {{.NORMA_MAIN_PATH}}
    
  install:
    desc: Build and install norma to GOBIN
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
    cmds:
      - echo "Installing {{.NORMA_BINARY_NAME}} version {{.VERSION}}"
      - go install -ldflags "-X main.version={{.VERSION}}" {{.NORMA_MAIN_PATH}}
    
  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.OUTPUT_DIR}}
      
  test:
    desc: Run tests
    cmds:
      - go test ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - go tool golangci-lint run
